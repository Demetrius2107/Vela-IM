server:
  port: 8012

spring:
  main:
    # group 依赖 message/user 模块：跨模块扫描时 message 与 user 各有一个 name="vela-group" 的 FeignClient，
    # 同名 FeignClientSpecification 会重复注册，此处允许覆盖（与 vela-service-message 一致）
    allow-bean-definition-overriding: true
  application:
    name: vela-group
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/vela?serverTimezone=UTC&useSSL=false&characterEncoding=UTF8
    username: root
    password: root
  redis:
    host: 127.0.0.1
    port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        concurrency: 5
        max-concurrency: 10
        acknowledge-mode: MANUAL
        prefetch: 1

appConfig:
  appId: 10000
  privateKey: 123456
  imRouteWay: 1
  loginModel: 1

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:mapper/*.xml
  global-config:
    db-config:
      update-strategy: NOT_EMPTY

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
